<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>FinLab — Personal Finance</title>
    <meta name="description" content="FinLab — Personal finance management, expense tracking, and wealth clarity." />
    
    <!-- Progressive Web App Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinLab" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FinLab" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          let preference = localStorage.getItem('finlab-theme');
          if (preference === 'system') {
            preference = 'light';
            localStorage.setItem('finlab-theme', 'light');
          }
          const dark = preference === 'dark';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch { /* ThemeProvider applies the selected theme after startup. */ }
      })();
    </script>
  </head>
  <body style="font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
